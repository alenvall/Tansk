[workspace]
resolver = "2"
members = ["crates/tansk-sim", "crates/tansk3d-sim", "crates/tansk-server", "crates/tansk-web", "crates/arena-client", "crates/arena-audio", "crates/arena-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The WASM client: small and fast.
[profile.release.package.tansk-web]
opt-level = "s"

