<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Phones: no pinch or double-tap zoom (the thumbs are busy), the notch
       area used in landscape (safe-area insets keep the HUD clear of it). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1d1612">
  <title>TANSK 2026</title>
  <link data-trunk rel="rust" data-bin="arena-client" data-wasm-opt="z" />
  <link data-trunk rel="copy-dir" href="assets/sounds" />
  <style>
    html, body { margin: 0; height: 100%; background: #1d1612; overflow: hidden; }
    /* No pull-to-refresh, no rubber-band scroll, no long-press menus or
       selection on the game itself. */
    html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    #tansk-canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #tansk-message {
      display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px;
      font: 500 17px/1.45 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; color: #f6ead2;
      background: radial-gradient(ellipse at 50% 40%, #c9965a 0%, #8a4a1c 55%, #2a1408 100%);
      overflow: auto;
    }
    #tansk-message .tm-card {
      position: relative; max-width: 30rem; padding: 26px 28px 22px; border-radius: 6px; text-align: left;
      background: linear-gradient(180deg, #4d4640 0%, #3b3530 55%, #2e2925 100%);
      box-shadow: inset 0 1px 0 rgba(255, 236, 206, .3), inset 0 -2px 0 rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(0, 0, 0, .4), 0 4px 0 rgba(22, 15, 10, .55), 0 10px 28px rgba(40, 22, 8, .45);
    }
    #tansk-message .tm-card::after { /* four rivets */
      content: ""; position: absolute; inset: 7px; pointer-events: none;
      --r: radial-gradient(circle at 42% 38%, #fff1d8 0 9%, #a89a88 20% 36%, #4a423b 50%, rgba(0,0,0,.55) 60%, transparent 70%);
      background: var(--r) left top / 10px 10px no-repeat, var(--r) right top / 10px 10px no-repeat, var(--r) left bottom / 10px 10px no-repeat, var(--r) right bottom / 10px 10px no-repeat;
    }
    #tansk-message .tm-hazard { height: 8px; margin: 0 0 14px; border-radius: 1px; background: repeating-linear-gradient(-45deg, #f2c230 0 6px, #1d1a17 6px 12px); }
    #tansk-message strong { display: block; margin-bottom: 8px; font: 400 26px/1.1 'Black Ops One', Impact, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #ff9a4c; text-shadow: 0 2px 0 #000; }
    #tansk-message p { margin: 0 0 10px; }
    #tansk-message b { color: #f2c230; }
    #tansk-message .tm-detail { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.45); font: 13px/1.35 ui-monospace, monospace; color: #bcae94; word-break: break-word; }
  </style>
</head>
<body>
  <canvas id="tansk-canvas"></canvas>
  <div id="tansk-message"></div>
  <script>
    // Shown by the wasm module too, but this catches the case where it never
    // gets that far (no WebGPU at all), before any wasm is downloaded.
    if (!('gpu' in navigator)) {
      const m = document.getElementById('tansk-message');
      m.style.display = 'flex';
      m.innerHTML = '<div class="tm-card"><div class="tm-hazard"></div>' +
        '<strong>This browser can’t drive TANSK yet</strong>' +
        '<p>TANSK draws with WebGPU. On a phone or tablet that means a recent <b>Chrome</b> (Android 12 or newer) ' +
        'or <b>Safari</b> (iOS / iPadOS 26 or newer); on a computer, a current Chrome, Edge, Safari or Firefox.</p>' +
        '<p>Update the browser, or open the link in one of those.</p>' +
        '<p class="tm-detail">navigator.gpu is missing</p></div>';
    }
  </script>
</body>
</html>
